[profile.default]
src = "src"
out = "out"
libs = ["lib", "dependencies"]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.17"
auto_detect_solc = true
gas_limit = 1073741824

[dependencies]
solady = "0.1.12"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
